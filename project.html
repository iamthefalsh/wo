<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Acidnade Project</title>
  <style>
    body {
      background: #0f0f0f;
      color: white;
      font-family: sans-serif;
      padding: 30px;
    }
    #chat {
      background: #151515;
      border-radius: 12px;
      padding: 16px;
      height: 300px;
      overflow-y: auto;
      margin-bottom: 12px;
    }
    .msg {
      margin-bottom: 8px;
    }
    .user {
      color: #7cff6b;
    }
    .ai {
      color: #7aa2ff;
    }
    textarea {
      width: 100%;
      height: 60px;
      border-radius: 8px;
      border: none;
      padding: 8px;
      resize: none;
    }
    button {
      margin-top: 8px;
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      background: #7cff6b;
      color: black;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h2>Project</h2>
  <div id="chat"></div>

  <textarea id="input" placeholder="Type a message..."></textarea>
  <br />
  <button onclick="send()">Send</button>

  <script src="/site.js"></script>
</body>
</html>
